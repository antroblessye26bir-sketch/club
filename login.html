<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | ClubHub</title>
  <link rel="stylesheet" href="../../shared/styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-card card">
    <div class="auth-brand">Club<span>Hub</span></div>
    <p class="muted">Student Club Management</p>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn block">Log in</button>
    </form>
    <p class="switch">New here? <a href="register.html">Create an account</a></p>
    <div class="demo">
      <strong>Demo accounts</strong><br>
      Admin: admin@club.edu / admin123<br>
      Member: member@club.edu / member123
    </div>
  </main>
  <script src="../../shared/store.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="auth.js"></script>
</body>
</html>
